<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WinCash</title><style>body{font-family:sans-serif;background:#eef2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:25px;border-radius:16px;text-align:center;width:85%;max-width:350px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}.points{font-size:42px;color:#27ae60;font-weight:bold;margin:15px 0}button{background:#27ae60;color:#fff;border:none;padding:12px;border-radius:8px;font-size:16px;font-weight:bold;width:100%;margin-top:10px;cursor:pointer}input,select{width:90%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font-size:14px;box-sizing:border-box}.withdraw-section{margin-top:20px;border-top:1px solid #eee;padding-top:15px}</style></head><body><div class="card"><h1>تطبيق WinCash 💰</h1><p>رصيد النقاط الحالي</p><div class="points" id="pts">100</div><button onclick="showAd()">مشاهدة الإعلان (+50 نقطة)</button><div class="withdraw-section"><h3>سحب الأرباح 💸</h3><select id="method"><option value="Binance">Binance Pay (USDT)</option><option value="M-Pesa">M-Pesa</option></select><input type="text" id="account" placeholder="رقم المحفظة / الهاتف"><button style="background:#e67e22" onclick="withdraw()">طلب السحب (الحد الأدنى 1000 نقطة)</button></div></div><script>function showAd(){alert("جاري عرض الإعلان...");fetch("/api/add",{method:"POST"}).then(r=>r.json()).then(d=>{document.getElementById("pts").innerText=d.points;alert("تمت إضافة 50 نقطة!")})}function withdraw(){const m=document.getElementById("method").value;const a=document.getElementById("account").value;if(!a){alert("الرجاء إدخال رقم المحفظة أو الحساب");return}fetch("/api/withdraw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({method:m,account:a})}).then(r=>r.json()).then(d=>{if(d.error){alert(d.error)}else{document.getElementById("pts").innerText=d.points;alert("تم إرسال طلب السحب بنجاح!")}})}</script></body></html>
