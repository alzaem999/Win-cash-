<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinCash Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- الإعلان الثاني: Social Bar (شريط تفاعلي عائم) -->
  <script src="https://pl30981648.profitableratecpmnetwork.com/35/50/05/355005c9c4114d1f559a5931a65bdb39.js"></script>

  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 15px; min-height: 100vh; }
    .container { width: 100%; max-width: 400px; background: #1e293b; padding: 20px; border-radius: 15px; text-align: center; }
    .card { background: linear-gradient(135deg, #10b981, #059669); padding: 15px; border-radius: 12px; margin: 15px 0; }
    .ref-card { background: #334155; padding: 12px; border-radius: 10px; margin: 10px 0; border: 1px dashed #10b981; }
    .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; font-size: 15px; }
    .btn-blue { background: #3b82f6; }
    .btn-green { background: #10b981; }
    .btn-purple { background: #8b5cf6; }
    .btn-orange { background: #f59e0b; }
    .btn-red { background: #ef4444; }
    .btn-dark { background: #334155; }
    input, select { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; }
    .hidden { display: none !important; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; justify-content:center; align-items:center; z-index:999; }
    .modal-content { background:#1e293b; padding:20px; border-radius:15px; width:90%; max-width:340px; position:relative; }
    
    /* مكان شريط الإعلان الأول */
    .ad-banner-box { width: 100%; max-width: 400px; margin: 10px 0; text-align: center; background: #1e293b; border-radius: 8px; padding: 5px; min-height: 60px; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    /* تصميم عجلة الحظ */
    .wheel-box { position: relative; width: 240px; height: 240px; margin: 15px auto; }
    .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid #ef4444; z-index: 10; }
    .wheel { 
      width: 100%; height: 100%; border-radius: 50%; border: 5px solid #f59e0b; 
      transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1); 
      background: conic-gradient(#3b82f6 0deg 90deg, #10b981 90deg 180deg, #8b5cf6 180deg 270deg, #f59e0b 270deg 360deg); 
      position: relative; overflow: hidden;
    }
    .wheel-section { position: absolute; width: 50%; height: 50%; top: 0; left: 50%; transform-origin: 0% 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
  </style>
</head>
<body>

  <!-- الإعلان الأول: Adsterra Banner 320x50 -->
  <div class="ad-banner-box" id="top-banner">
    <script type="text/javascript">
      atOptions = {
        'key' : 'fd8524af6d1c4eefc47c8cc422ddc34f',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="https://www.highrevenueformat.com/fd8524af6d1c4eefc47c8cc422ddc34f/invoke.js"></script>
  </div>

  <div class="container">
    <h2>💰 WinCash Pro</h2>

    <!-- Auth -->
    <div id="auth-box">
      <h3 style="margin:10px 0;">تسجيل الدخول / حساب جديد</h3>
      <input type="email" id="email" placeholder="البريد الإلكتروني">
      <input type="password" id="password" placeholder="كلمة المرور">
      <input type="text" id="ref-code-input" placeholder="كود الدعوة (اختياري للحصول على +50 نقطة)">
      <button class="btn btn-blue" onclick="login()">دخول</button>
      <button class="btn btn-green" onclick="register()">إنشاء حساب جديد</button>
    </div>

    <!-- Main -->
    <div id="main-box" class="hidden">
      <div class="card">
        <span>رصيد النقاط الحالية</span>
        <h1 id="points">0</h1>
      </div>

      <!-- نظام الدعوات والإحالة -->
      <div class="ref-card">
        <p style="font-size:13px; color:#cbd5e1;">👥 كود الدعوة الخاص بك (شاركه واربح +50 نقطة):</p>
        <h3 id="my-ref-code" style="color:#10b981; margin:5px 0;">---</h3>
        <button class="btn btn-dark" style="padding:6px; font-size:12px;" onclick="shareRefLink()">📲 مشاركة رابط الدعوة</button>
      </div>

      <button class="btn btn-blue" onclick="claimDaily()">📅 مكافأة يومية (+50)</button>
      <button class="btn btn-purple" onclick="openWheel()">🎡 عجلة الحظ التفاعلية</button>
      <button class="btn btn-green" onclick="showAd()">📺 مشاهدة إعلان حقيقي (+50)</button>

      <h3 style="margin-top:15px;">💸 سحب الأرباح</h3>
      <select id="method">
        <option>Binance Pay (USDT)</option>
        <option>M-Pesa</option>
        <option>Payeer</option>
      </select>
      <input type="text" id="wallet" placeholder="رقم المحفظة / ID">
      <button class="btn btn-orange" onclick="withdraw()">طلب السحب (الحد الأدنى 1000)</button>

      <hr style="margin:15px 0; border-color:#334155;">
      
      <!-- زر الأدمن الخاص بـ alzae999m.com@gmail.com فقط -->
      <button id="admin-btn" class="btn btn-dark hidden" onclick="openAdmin()">⚙️ لوحة الأدمن (السحوبات)</button>
      
      <button class="btn btn-red" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

  <!-- Wheel Modal -->
  <div id="wheel-modal" class="modal hidden">
    <div class="modal-content">
      <h3>🎡 أدر العجلة واربح نقاطاً!</h3>
      <div class="wheel-box">
        <div class="wheel-pointer"></div>
        <div id="wheel" class="wheel">
          <div class="wheel-section" style="transform: rotate(45deg);">2</div>
          <div class="wheel-section" style="transform: rotate(135deg);">8</div>
          <div class="wheel-section" style="transform: rotate(225deg);">15</div>
          <div class="wheel-section" style="transform: rotate(315deg);">25</div>
        </div>
      </div>
      <button class="btn btn-purple" id="spin-btn" onclick="spinWheel()">تدوير الآن</button>
      <button class="btn btn-dark" style="margin-top:5px;" onclick="closeModal('wheel-modal')">إغلاق</button>
    </div>
  </div>

  <!-- Admin Modal (محمي) -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <h3>📋 طلبات السحب (خاص بالأدمن)</h3>
      <div id="admin-list" style="margin:10px 0; text-align:right; max-height:250px; overflow-y:auto;"></div>
      <button class="btn btn-dark" onclick="closeModal('admin-modal')">إغلاق</button>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = "alzae999m.com@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyBzYf0qiWDUjbV4REkorvqld30L6mh3_o8",
      authDomain: "win-cash-74341.firebaseapp.com",
      projectId: "win-cash-74341",
      storageBucket: "win-cash-74341.firebasestorage.app",
      messagingSenderId: "530046711688",
      appId: "1:530046711688:web:125ffee9ef4716a2a12c3d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let user = null;
    let uData = {};
    let currentRotation = 0;

    auth.onAuthStateChanged(u => {
      if(u) {
        user = u;
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('main-box').classList.remove('hidden');

        if (user.email === ADMIN_EMAIL) {
          document.getElementById('admin-btn').classList.remove('hidden');
        } else {
          document.getElementById('admin-btn').classList.add('hidden');
        }

        loadData();
      } else {
        document.getElementById('auth-box').classList.remove('hidden');
        document.getElementById('main-box').classList.add('hidden');
      }
    });

    function register() {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      const refInput = document.getElementById('ref-code-input').value.trim();
      
      if(!e || !p) return alert("الرجاء إدخال البريد وكلمة المرور!");

      auth.createUserWithEmailAndPassword(e, p).then(r => {
        const myRef = "WIN" + Math.floor(10000 + Math.random() * 90000);
        let startPoints = 100;

        if (refInput) {
          startPoints += 50;
          db.collection('users').where('refCode', '==', refInput).get().then(snap => {
            if(!snap.empty) {
              const referrer = snap.docs[0];
              db.collection('users').doc(referrer.id).update({
                points: (referrer.data().points || 0) + 50
              });
            }
          });
        }

        db.collection('users').doc(r.user.uid).set({ 
          points: startPoints, 
          lastDaily: 0,
          refCode: myRef
        });
      }).catch(err => alert(err.message));
    }

    function login() {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
    }

    function loadData() {
      db.collection('users').doc(user.uid).onSnapshot(doc => {
        if(doc.exists) {
          uData = doc.data();
          document.getElementById('points').innerText = uData.points || 0;
          document.getElementById('my-ref-code').innerText = uData.refCode || "WIN12345";
        }
      });
    }

    function shareRefLink() {
      const code = uData.refCode || "";
      const text = `انضم إلى تطبيق WinCash Pro واكسب المال! استخدم كود الدعوة الخاص بي (${code}) لتحصل على 50 نقطة مجانية عند التسجيل: ${window.location.href}`;
      if (navigator.share) {
        navigator.share({ title: 'WinCash Pro', text: text });
      } else {
        navigator.clipboard.writeText(text);
        alert("تم نسخ رابط وكود الدعوة بنجاح!");
      }
    }

    function claimDaily() {
      const now = Date.now();
      if(uData.lastDaily && (now - uData.lastDaily < 86400000)) return alert("أخذت المكافأة اليوم بالفعل!");
      db.collection('users').doc(user.uid).update({ points: (uData.points||0) + 50, lastDaily: now });
      alert("تمت إضافة 50 نقطة!");
    }

    function openWheel() { document.getElementById('wheel-modal').classList.remove('hidden'); }
    
    function spinWheel() {
      const btn = document.getElementById('spin-btn');
      btn.disabled = true;
      const wheel = document.getElementById('wheel');
      
      const randomSpin = 1800 + Math.floor(Math.random() * 360);
      currentRotation += randomSpin;
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        const rewards = [2, 8, 15, 25];
        const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
        
        db.collection('users').doc(user.uid).update({ points: (uData.points||0) + randomReward });
        alert(`🎉 مبروك! فزت بـ ${randomReward} نقطة!`);
        btn.disabled = false;
        closeModal('wheel-modal');
      }, 4000);
    }

    function showAd() {
      if(confirm("سيتم فتح صفحة الإعلان. شاهد الإعلان ثم عد إلى التطبيق لتحصيل 50 نقطة! هل تريد المتابعة؟")) {
        window.open('https://www.effectiveratecpm.com/z4b0q53j?key=95188f5f4039e24b4f53ca833b3ca728', '_blank');
        
        setTimeout(() => {
          db.collection('users').doc(user.uid).update({ points: (uData.points||0) + 50 });
          alert("🎉 شكراً لمشاهدتك الإعلان! تمت إضافة +50 نقطة لرصيدك.");
        }, 5000);
      }
    }

    function withdraw() {
      const w = document.getElementById('wallet').value;
      if(!w) return alert("أدخل المحفظة!");
      if((uData.points||0) < 1000) return alert("الحد الأدنى للسحب هو 1000 نقطة!");
      
      db.collection('withdrawals').add({
        email: user.email,
        method: document.getElementById('method').value,
        wallet: w,
        points: uData.points,
        status: 'معلق'
      }).then(() => {
        db.collection('users').doc(user.uid).update({ points: 0 });
        alert("تم إرسال طلب السحب بنجاح!");
      });
    }

    function openAdmin() {
      if (user.email !== ADMIN_EMAIL) return alert("غير مصرح لك بالدخول!");
      
      document.getElementById('admin-modal').classList.remove('hidden');
      const list = document.getElementById('admin-list');
      list.innerHTML = "جاري التحميل...";
      db.collection('withdrawals').get().then(snap => {
        list.innerHTML = "";
        if(snap.empty) {
          list.innerHTML = "<p>لا توجد طلبات سحب حالياً.</p>";
          return;
        }
        snap.forEach(d => {
          const data = d.data();
          list.innerHTML += `<div style="border-bottom:1px solid #475569; padding:8px 0;">
            <p>📧 <b>${data.email}</b></p>
            <p>💰 ${data.points} نقطة - ${data.method}</p>
            <p>💳 المحفظة: ${data.wallet}</p>
          </div>`;
        });
      });
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function logout() { auth.signOut(); }
  </script>
</body>
</html>
