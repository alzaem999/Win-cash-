<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinCash Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; padding: 15px; }
    .container { width: 100%; max-width: 400px; background: #1e293b; padding: 20px; border-radius: 15px; text-align: center; }
    .card { background: #10b981; padding: 15px; border-radius: 10px; margin: 15px 0; }
    .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; }
    .btn-blue { background: #3b82f6; }
    .btn-green { background: #10b981; }
    .btn-purple { background: #8b5cf6; }
    .btn-orange { background: #f59e0b; }
    .btn-red { background: #ef4444; }
    .btn-dark { background: #334155; }
    input, select { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; }
    .hidden { display: none !important; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:999; }
    .modal-content { background:#1e293b; padding:20px; border-radius:12px; width:90%; max-width:320px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>💰 WinCash Pro</h2>

    <!-- Auth Screen -->
    <div id="auth-box">
      <h3 style="margin:10px 0;">تسجيل الدخول / حساب جديد</h3>
      <input type="email" id="email" placeholder="البريد الإلكتروني">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button class="btn btn-blue" onclick="login()">دخول</button>
      <button class="btn btn-green" onclick="register()">إنشاء حساب</button>
    </div>

    <!-- Main Screen -->
    <div id="main-box" class="hidden">
      <div class="card">
        <span>رصيد النقاط</span>
        <h1 id="points">0</h1>
      </div>

      <button class="btn btn-blue" id="daily-btn" onclick="claimDaily()">📅 مكافأة يومية (+50)</button>
      <button class="btn btn-purple" onclick="spinWheel()">🎡 عجلة الحظ (حسب حظك)</button>
      <button class="btn btn-green" onclick="watchAd()">📺 مشاهدة إعلان (+50)</button>

      <h3 style="margin-top:15px;">💸 سحب الأرباح</h3>
      <select id="method">
        <option>Binance Pay (USDT)</option>
        <option>M-Pesa</option>
        <option>Payeer</option>
      </select>
      <input type="text" id="wallet" placeholder="رقم المحفظة / ID">
      <button class="btn btn-orange" onclick="withdraw()">طلب السحب (الحد الأدنى 1000)</button>

      <hr style="margin:15px 0; border-color:#334155;">
      <button class="btn btn-dark" onclick="openAdmin()">⚙️ لوحة الأدمن (السحوبات)</button>
      <button class="btn btn-red" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

  <!-- Admin Modal -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <h3>📋 طلبات السحب</h3>
      <div id="admin-list" style="margin:10px 0; text-align:right; max-height:200px; overflow-y:auto;"></div>
      <button class="btn btn-dark" onclick="closeAdmin()">إغلاق</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBzYf0qiWDUjbV4REkorvqld30L6mh3_o8",
      authDomain: "win-cash-74341.firebaseapp.com",
      projectId: "win-cash-74341",
      storageBucket: "win-cash-74341.firebasestorage.app",
      messagingSenderId: "530046711688",
      appId: "1:530046711688:web:125ffee9ef4716a2a12c3d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let user = null;
    let uData = {};

    auth.onAuthStateChanged(u => {
      if(u) {
        user = u;
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('main-box').classList.remove('hidden');
        loadData();
      } else {
        document.getElementById('auth-box').classList.remove('hidden');
        document.getElementById('main-box').classList.add('hidden');
      }
    });

    function register() {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(e, p).then(r => {
        db.collection('users').doc(r.user.uid).set({ points: 100, lastDaily: 0 });
      }).catch(err => alert(err.message));
    }

    function login() {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
    }

    function loadData() {
      db.collection('users').doc(user.uid).onSnapshot(doc => {
        if(doc.exists) {
          uData = doc.data();
          document.getElementById('points').innerText = uData.points || 0;
        }
      });
    }

    function claimDaily() {
      const now = Date.now();
      if(uData.lastDaily && (now - uData.lastDaily < 86400000)) return alert("أخذت المكافأة اليوم بالفعل!");
      db.collection('users').doc(user.uid).update({ points: (uData.points||0) + 50, lastDaily: now });
      alert("تمت إضافة 50 نقطة!");
    }

    function spinWheel() {
      const reward = Math.floor(Math.random() * 50) + 10;
      db.collection('users').doc(user.uid).update({ points: (uData.points||0) + reward });
      alert("ربحت " + reward + " نقطة!");
    }

    function watchAd() {
      alert("انتظر 5 ثوانٍ لمشاهدة الإعلان...");
      setTimeout(() => {
        db.collection('users').doc(user.uid).update({ points: (uData.points||0) + 50 });
        alert("مبروك! حصلت على 50 نقطة.");
      }, 5000);
    }

    function withdraw() {
      const w = document.getElementById('wallet').value;
      if(!w) return alert("أدخل المحفظة!");
      if((uData.points||0) < 1000) return alert("الحد الأدنى للسحب هو 1000 نقطة!");
      
      db.collection('withdrawals').add({
        email: user.email,
        method: document.getElementById('method').value,
        wallet: w,
        points: uData.points,
        status: 'معلق'
      }).then(() => {
        db.collection('users').doc(user.uid).update({ points: 0 });
        alert("تم إرسال الطلب بنجاح!");
      });
    }

    function openAdmin() {
      document.getElementById('admin-modal').classList.remove('hidden');
      const list = document.getElementById('admin-list');
      list.innerHTML = "جاري التحميل...";
      db.collection('withdrawals').get().then(snap => {
        list.innerHTML = "";
        if(snap.empty) {
          list.innerHTML = "<p>لا توجد طلبات سحب.</p>";
          return;
        }
        snap.forEach(d => {
          const data = d.data();
          list.innerHTML += `<div style="border-bottom:1px solid #475569; padding:5px 0;">
            <p><b>${data.email}</b></p>
            <p>${data.points} نقطة - ${data.method}</p>
            <p>المحفظة: ${data.wallet}</p>
          </div>`;
        });
      });
    }

    function closeAdmin() { document.getElementById('admin-modal').classList.add('hidden'); }
    function logout() { auth.signOut(); }
  </script>
</body>
</html>
